# Applies suggestions approved in the atlas, saves the data changes to main and publishes the site.
# Start it from the Actions tab (Run workflow); it also runs after every publish of the site and once a day.
# Its own data commit is pushed with the job token, which does not start this workflow again.
# Needs the SUPABASE_SERVICE_KEY repository secret; the key stays in GitHub and is never printed.
name: Apply approved suggestions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check the approved suggestions, without changing anything
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-suggestions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved suggestions
        env:
          SUPABASE_URL: https://ihdmipwmgsmzugcekwbk.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::Add the SUPABASE_SERVICE_KEY repository secret first."; exit 1; fi
          if [ "$DRY_RUN" = "true" ]; then node scripts/apply-approved.mjs --dry-run; else node scripts/apply-approved.mjs; fi
      # Runs even when the step above failed: data written before a failed backend update must be kept so a rerun can finish the batch.
      - name: Save and publish the changes
        if: ${{ !cancelled() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          if git diff --cached --quiet; then echo "No approved suggestions to publish."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish approved community suggestions'
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made by this job does not start other workflows, so start the site publish directly.
          gh workflow run pages.yml --ref main
