# Applies suggestions approved in the atlas, saves the data changes to main and publishes the site.
# Start it from the Actions tab (Run workflow); it also runs after every publish of the site and every hour.
# Its own data commit is pushed with the job token, which does not start this workflow again.
# Needs the SUPABASE_SERVICE_KEY repository secret; the key stays in GitHub and is never printed.
name: Apply approved suggestions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check the approved suggestions, without changing anything
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-suggestions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved suggestions
        env:
          SUPABASE_URL: https://ihdmipwmgsmzugcekwbk.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::Add the SUPABASE_SERVICE_KEY repository secret first."; exit 1; fi
          if [ "$DRY_RUN" = "true" ]; then node scripts/apply-approved.mjs --dry-run; else node scripts/apply-approved.mjs; fi
      - name: Save and publish the changes
        id: save
        if: ${{ success() && inputs.dry_run != true }}
        env:
          SUPABASE_URL: https://ihdmipwmgsmzugcekwbk.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          committed=false
          save() {
            committed=false
            git add data
            if ! git diff --cached --quiet; then git commit -m 'Publish approved community suggestions'; committed=true; fi
          }
          save
          if ! git push origin HEAD:main; then
            # Recheck against the edition that won the race, once, before trying the push again.
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-approved.mjs
            save
            git push origin HEAD:main
          fi
          # The site is rebuilt only when this run changed its data.
          if [ "$committed" = "true" ]; then echo "pushed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Acknowledge the published suggestions
        if: ${{ success() && inputs.dry_run != true }}
        env:
          SUPABASE_URL: https://ihdmipwmgsmzugcekwbk.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/apply-approved.mjs --mark-published .publish/applied.json
      # A push made by this job does not start other workflows, so start the site publish directly.
      - name: Publish the site
        if: ${{ success() && inputs.dry_run != true && steps.save.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
