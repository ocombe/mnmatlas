# Publishes the site to GitHub Pages on every push to main.
# The per-map pages (<map-id>/index.html) and 404.html are built here from index.html, so the repo keeps only the main page.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build map pages
        run: node scripts/make-share-pages.mjs
      - name: Build mini map images
        run: |
          python3 -m pip install --quiet pillow fonttools brotli
          python3 scripts/make-mini-maps.py
      # The Wanted board's lists need the wiki key (repository secret WIKI_API_KEY); without it they are skipped.
      - name: Build bounty lists
        continue-on-error: true
        env:
          WIKI_API_KEY: ${{ secrets.WIKI_API_KEY }}
        run: node scripts/make-bounties.mjs
      # NPC wiki cards for marker popups, from the same key (one wiki request per linked NPC, a second apart).
      - name: Build NPC wiki cards
        continue-on-error: true
        env:
          WIKI_API_KEY: ${{ secrets.WIKI_API_KEY }}
        run: node scripts/make-npc-cards.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
